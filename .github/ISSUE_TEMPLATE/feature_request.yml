name: Feature request
description: Propose a new feature or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Compatibility impact
      description: Does this change commands, flags, output, exit codes or the homing.toml format? How are existing scripts affected?
