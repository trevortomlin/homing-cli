[package]
name = "homing-cli"
version = "0.1.0"
description = "Host tool for creating, signing and verifying homing app packages"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trevortomlin/homing-cli"
authors = ["Trevor Tomlin and homing contributors"]
readme = "README.md"
homepage = "https://github.com/trevortomlin/homing-cli"
keywords = ["ota", "flutter", "embedded", "signing", "cli"]
categories = ["command-line-utilities", "embedded", "development-tools"]

[[bin]]
name = "homing"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
homing-format = { git = "https://github.com/trevortomlin/homing-format", tag = "v0.1.0" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
